services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newshub
      POSTGRES_PASSWORD: newshub
      POSTGRES_DB: newshub
    ports:
      - "5432:5432"
    volumes:
      - newshub_postgres_data:/var/lib/postgresql/data

volumes:
  newshub_postgres_data:
