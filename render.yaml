databases:
  - name: newshub-db
    plan: free
    region: oregon

services:
  - type: web
    name: newshub-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    # --include=dev: Render sets NODE_ENV=production before this runs, which
    # makes plain `npm install` skip devDependencies — but tsc, prisma, and
    # the @types/* packages (all devDependencies) are needed to build here.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # seed:organizations is upsert-based (keyed on slug), so it's safe to
    # run on every start — this is also how the 5 orgs get seeded in
    # production at all, since the local-only seed script was never run
    # against the Render database otherwise.
    startCommand: npx prisma migrate deploy && npm run seed:organizations && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: newshub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Set manually in the Render dashboard after creating the account —
      # never committed. See api/.env.example for the shape.
      - key: NEWS_API_KEY
        sync: false
      # Fill in after the newshub-web static site exists and has a public
      # URL (e.g. https://newshub-web.onrender.com) — Render only assigns
      # that URL once the service is first created, so this can't be wired
      # automatically in this file. Redeploy newshub-api after setting it.
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: newshub-web
    runtime: static
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # Fill in after newshub-api exists and has a public URL (e.g.
      # https://newshub-api.onrender.com/api) — same chicken-and-egg
      # reason as WEB_ORIGIN above. Redeploy newshub-web after setting it,
      # since Vite bakes this in at build time.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
